<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f1114">
  <meta name="description" content="Rankingi graczy i sojuszów Goodgame Empire na żywo / Live Goodgame Empire player & alliance rankings.">
  <title>GGE Rankings</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=20260817-1">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<!-- App shell: fixed sidebar (context + navigation) beside a main column that owns the
     full remaining viewport. The table scrolls inside .view; status and pagination stay
     pinned to the bottom edge. -->
<div class="app">

  <aside class="side" id="side">
    <div class="side-head">
      <a class="logo" href="https://dolildev.github.io/gge-rankings/">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path class="lm-bg" d="M12 2 3.5 4.8v7.2c0 4.9 3.4 8.7 8.5 10 5.1-1.3 8.5-5.1 8.5-10V4.8z"/>
            <path class="lm-fg" d="M12 7.4 16.6 13h-2.4L12 10.2 9.8 13H7.4z"/>
            <path class="lm-fg" d="M12 12.2 16.6 17.8h-2.4L12 15 9.8 17.8H7.4z"/>
          </svg>
        </span>
        <span class="logo-txt">GGE<span class="logo-sub">Rankings</span></span>
      </a>
    </div>

    <nav class="nav" role="tablist">
      <button class="nav-btn on" data-p="ranking" role="tab" aria-selected="true"><svg class="ic"><use href="#i-trophy"></use></svg><span data-t="Ranking">Ranking</span></button>
      <button class="nav-btn" data-p="favorites" role="tab" aria-selected="false"><svg class="ic"><use href="#i-star"></use></svg><span data-t="Ulubieni">Ulubieni</span><span class="fav-n" id="favCnt">0</span></button>
    </nav>

    <div class="side-scroll">

      <div class="side-sec">
        <div class="side-t" data-t="Serwer">Serwer</div>
        <div class="srv-wrap" id="srvWrap">
          <button class="srv-btn" id="srvBtn" type="button" data-tar="Wybierz serwer" aria-label="Wybierz serwer" aria-haspopup="listbox">
            <span id="srvBtnFlag" class="srv-btn-flag"></span>
            <span id="srvBtnCode" class="srv-btn-code"></span>
            <span id="srvBtnName" class="srv-btn-name">Ładowanie...</span>
            <svg class="ic srv-arrow"><use href="#i-chevron-down"></use></svg>
          </button>
          <div class="srv-drop h" id="srvDrop" role="listbox">
            <div class="srv-search-wrap">
              <input type="text" id="srvSearch" placeholder="Szukaj serwera..." autocomplete="off" data-tph="Szukaj serwera..." data-tar="Szukaj serwera" aria-label="Szukaj serwera">
            </div>
            <div class="srv-list" id="srvList"></div>
          </div>
        </div>
        <div class="seg" id="typeSeg" role="tablist">
          <button class="seg-b on" data-v="player" role="tab" aria-selected="true"><svg class="ic"><use href="#i-user"></use></svg><span data-t="Gracze">Gracze</span></button>
          <button class="seg-b" data-v="alliance" role="tab" aria-selected="false"><svg class="ic"><use href="#i-shield"></use></svg><span data-t="Sojusze">Sojusze</span></button>
        </div>
      </div>

      <div class="side-sec">
        <div class="side-t" data-t="Ranking">Ranking</div>
        <div class="ev-list" id="eventList" role="tablist"><div class="side-empty">Ładowanie...</div></div>
      </div>

      <div class="side-sec fbar h" id="fBar">
        <div class="side-t" data-t="Filtry">Filtry</div>
        <div class="fgrp">
          <span class="tlbl" data-t="Sojusz:">Sojusz:</span>
          <div class="seg" id="fAlSeg">
            <button class="seg-b on" data-f="all" data-t="Wszyscy">Wszyscy</button>
            <button class="seg-b" data-f="with" data-t="Z sojuszem">Z sojuszem</button>
            <button class="seg-b" data-f="without" data-t="Bez sojuszu">Bez sojuszu</button>
          </div>
        </div>
        <div class="fgrp">
          <span class="tlbl" data-t="Nazwa sojuszu:">Nazwa sojuszu:</span>
          <div class="sw">
            <svg class="ic sw-ic"><use href="#i-search"></use></svg>
            <input type="text" id="fAlName" placeholder="Filtruj po sojuszu..." data-tph="Filtruj po sojuszu..." data-tar="Filtruj po nazwie sojuszu" aria-label="Filtruj po nazwie sojuszu">
          </div>
        </div>
        <div class="fgrp">
          <span class="tlbl" data-t="Min. wynik:">Min. wynik:</span>
          <input type="number" id="fMinScore" placeholder="0" min="0" data-tar="Minimalny wynik" aria-label="Minimalny wynik">
        </div>
        <button class="btn" id="fClear" data-tar="Wyczyść filtry" aria-label="Wyczyść filtry"><svg class="ic"><use href="#i-x"></use></svg><span data-t="Wyczyść">Wyczyść</span></button>
        <span class="fhint" data-ttl="Po włączeniu filtra pobieramy do 2000 najlepszych graczy i filtrujemy wśród nich" title="Po włączeniu filtra pobieramy do 2000 najlepszych graczy i filtrujemy wśród nich"><svg class="ic"><use href="#i-info"></use></svg><span data-t="Filtry obejmują do 2000 graczy">Filtry obejmują do 2000 graczy</span></span>
      </div>

    </div>

    <div class="side-foot">
      <button class="btn icon-btn" id="langBtn" data-ttl="Język / Language" title="Język / Language" aria-label="Język / Language">PL</button>
      <button class="btn icon-btn" id="themeBtn" data-ttl="Zmień motyw (Shift+D)" data-tar="Zmień motyw" title="Zmień motyw (Shift+D)" aria-label="Zmień motyw"><svg class="ic"><use href="#i-moon"></use></svg></button>
      <button class="btn icon-btn" id="compactBtn" data-ttl="Tryb kompaktowy (Shift+C)" data-tar="Tryb kompaktowy (Shift+C)" title="Tryb kompaktowy (Shift+C)" aria-label="Tryb kompaktowy (Shift+C)"><svg class="ic"><use href="#i-rows"></use></svg></button>
    </div>
  </aside>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <main class="main">

    <div class="topbar">
      <button class="btn icon-btn side-toggle" id="sideBtn" data-tar="Menu" aria-label="Menu"><svg class="ic"><use href="#i-menu"></use></svg></button>
      <h1 class="view-title" id="viewTitle">GGE Rankings</h1>
      <div class="topbar-actions">
        <div class="sw">
          <svg class="ic sw-ic"><use href="#i-search"></use></svg>
          <input type="text" id="searchInput" placeholder="Rank lub nick... (/)" data-tph="Rank lub nick... (/)" data-tar="Wyszukaj rank lub nick" aria-label="Wyszukaj rank lub nick">
        </div>
        <button class="btn icon-btn" id="goSearch" title="Szukaj (Enter)" data-ttl="Szukaj (Enter)" data-tar="Szukaj" aria-label="Szukaj"><svg class="ic"><use href="#i-arrow-right"></use></svg></button>
        <button class="btn icon-btn" id="refreshBtn" title="Odśwież (R)" data-ttl="Odśwież (R)" data-tar="Odśwież" aria-label="Odśwież"><svg class="ic"><use href="#i-refresh"></use></svg></button>
        <button class="btn icon-btn" id="filterBtn" title="Filtry (F)" data-ttl="Filtry (F)" data-tar="Pokaż filtry" aria-label="Pokaż filtry" aria-expanded="false"><svg class="ic"><use href="#i-sliders"></use></svg></button>
        <div class="dwrap">
          <button class="btn icon-btn" id="exportBtn" title="Eksport (E)" data-ttl="Eksport (E)" data-tar="Eksportuj" aria-label="Eksportuj" aria-haspopup="menu"><svg class="ic"><use href="#i-download"></use></svg></button>
          <div class="mini-drop h" id="expDrop" role="menu">
            <button class="mini-opt" data-fmt="csv"><svg class="ic"><use href="#i-file"></use></svg><span>CSV (.csv)</span></button>
            <button class="mini-opt" data-fmt="json"><svg class="ic"><use href="#i-braces"></use></svg><span>JSON (.json)</span></button>
            <button class="mini-opt" data-fmt="link"><svg class="ic"><use href="#i-link"></use></svg><span data-t="Kopiuj link">Kopiuj link</span></button>
          </div>
        </div>
        <div class="dwrap">
          <button class="btn" id="autoRefBtn" title="Auto-odświeżanie" data-ttl="Auto-odświeżanie" data-tar="Auto-odświeżanie" aria-label="Auto-odświeżanie" aria-haspopup="menu"><svg class="ic"><use href="#i-clock"></use></svg><span id="autoRefLbl">Auto</span></button>
          <div class="mini-drop h" id="autoRefDrop" role="menu">
            <button class="mini-opt" data-v="0"><svg class="ic"><use href="#i-power"></use></svg><span data-t="Wyłącz">Wyłącz</span></button>
            <button class="mini-opt" data-v="30"><span class="ic"></span><span data-t="30 sekund">30 sekund</span></button>
            <button class="mini-opt" data-v="60"><span class="ic"></span><span data-t="1 minuta">1 minuta</span></button>
            <button class="mini-opt" data-v="300"><span class="ic"></span><span data-t="5 minut">5 minut</span></button>
            <button class="mini-opt" data-v="600"><span class="ic"></span><span data-t="10 minut">10 minut</span></button>
          </div>
        </div>
        <select id="pageSizeSel" class="rows-sel" data-tar="Wierszy na stronę" aria-label="Wierszy na stronę">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <button class="btn primary" id="addBtn" data-tar="Dodaj gracza do śledzenia" aria-label="Dodaj gracza do śledzenia"><svg class="ic"><use href="#i-plus"></use></svg><span data-t="Śledź">Śledź</span></button>
      </div>
    </div>

    <!-- Categories scope the ranking that is currently open, so they sit with the content. -->
    <div class="catbar" id="catSec" style="display:none">
      <span class="side-t" data-t="Kategoria">Kategoria</span>
      <div class="cats" id="catBar"></div>
    </div>

    <div class="view" id="view">
      <div id="mainView"></div>
      <div id="favView" style="display:none" class="fp">
        <div class="fph">
          <div class="fpt"><svg class="ic"><use href="#i-star"></use></svg><span data-t="Obserwowani gracze">Obserwowani gracze</span></div>
          <div class="fph-actions">
            <button class="btn" id="notifBtn"><svg class="ic"><use href="#i-bell"></use></svg><span data-t="Powiadomienia">Powiadomienia</span></button>
            <button class="btn" id="clearFavBtn"><svg class="ic"><use href="#i-trash"></use></svg><span data-t="Wyczyść">Wyczyść</span></button>
          </div>
        </div>
        <div class="fg" id="favGrid"></div>
      </div>
    </div>

    <div class="cbar h" id="cBar" role="region" data-tar="Pasek porównania" aria-label="Pasek porównania">
      <span class="ctitle"><svg class="ic"><use href="#i-columns"></use></svg><span data-t="Porównaj">Porównaj</span> <span class="ccnt" id="cCount">0</span> / 4</span>
      <div class="cChips" id="cChips"></div>
      <button class="btn primary" id="cOpenBtn"><span data-t="Porównaj">Porównaj</span><svg class="ic"><use href="#i-arrow-right"></use></svg></button>
      <button class="btn" id="cClearBtn" data-t="Wyczyść">Wyczyść</button>
    </div>

    <div class="foot">
      <div class="sbar spin" id="sBar">
        <div class="dot"></div>
        <span id="sMsg">Ładowanie...</span>
        <span id="sAutoR" style="display:none"><svg class="ic"><use href="#i-clock"></use></svg> <b id="sAutoRT">—</b></span>
      </div>
      <div class="foot-meta">
        <span><span data-t="Razem:">Razem:</span> <b id="sTotal">—</b></span>
        <span><span data-t="Strona:">Strona:</span> <b id="sPage">—</b></span>
      </div>
      <div class="pg" id="pgBar" style="display:none"></div>
    </div>

  </main>
</div>

<div class="mb h" id="mBackdrop" role="dialog" data-tar="Dodaj gracza" aria-label="Dodaj gracza" aria-modal="true">
  <div class="mo">
    <h3><svg class="ic"><use href="#i-star"></use></svg><span data-t="Śledź gracza">Śledź gracza</span></h3>
    <label for="mName" data-t="Nick gracza">Nick gracza</label><input type="text" id="mName" placeholder="Wpisz nick..." data-tph="Wpisz nick...">
    <label data-t="Serwer">Serwer</label>
    <div class="srv-wrap" id="mSrvWrap">
      <button class="srv-btn" id="mSrvBtn" type="button" aria-haspopup="listbox">
        <span id="mSrvBtnFlag" class="srv-btn-flag"></span>
        <span id="mSrvBtnCode" class="srv-btn-code"></span>
        <span id="mSrvBtnName" class="srv-btn-name" data-t="Wybierz serwer">Wybierz serwer</span>
        <svg class="ic srv-arrow"><use href="#i-chevron-down"></use></svg>
      </button>
      <div class="srv-drop h" id="mSrvDrop" role="listbox">
        <div class="srv-search-wrap">
          <input type="text" id="mSrvSearch" placeholder="Szukaj serwera..." autocomplete="off" data-tph="Szukaj serwera...">
        </div>
        <div class="srv-list" id="mSrvList"></div>
      </div>
    </div>
    <div class="me" id="mErr"></div>
    <div class="ma">
      <button class="btn" id="mCancel" data-t="Anuluj">Anuluj</button>
      <button class="btn primary" id="mOk"><svg class="ic"><use href="#i-star"></use></svg><span data-t="Śledź">Śledź</span></button>
    </div>
  </div>
</div>

<div class="mb h" id="cmpBackdrop" role="dialog" data-tar="Porównanie" aria-label="Porównanie" aria-modal="true">
  <div class="mo cmt">
    <div class="cmt-head">
      <h3><svg class="ic"><use href="#i-columns"></use></svg><span data-t="Porównanie">Porównanie</span></h3>
      <button class="btn icon-btn" id="cmpClose" data-tar="Zamknij" aria-label="Zamknij"><svg class="ic"><use href="#i-x"></use></svg></button>
    </div>
    <div id="cmpBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</defs></svg>

<!-- app.js was split into these 7 files; load order matters (main.js holds all wiring + init and must be last). -->
<script src="config.js?v=20260817-1"></script>
<script src="i18n.js?v=20260817-1"></script>
<script src="state.js?v=20260817-1"></script>
<script src="api.js?v=20260817-1"></script>
<script src="crest.js?v=20260817-1"></script>
<script src="render.js?v=20260817-1"></script>
<script src="features.js?v=20260817-1"></script>
<script src="main.js?v=20260817-1"></script>
</body>
</html>
