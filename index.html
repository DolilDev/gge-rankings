<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GGE Rankings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<div class="header">
  <a class="logo" href="https://dolildev.github.io/gge-rankings/" style="text-decoration:none;color:inherit">🏰 GGE Rankings</a>
  <nav class="nav" role="tablist">
    <button class="nav-btn on" data-p="ranking" role="tab" aria-selected="true">⚔️ Ranking</button>
    <button class="nav-btn" data-p="favorites" role="tab" aria-selected="false">⭐ Ulubieni</button>
  </nav>
  <div class="header-right">
    <button class="btn icon-btn" id="themeBtn" title="Zmień motyw (Shift+D)" aria-label="Zmień motyw">🌙</button>
    <button class="btn" id="favBtn" aria-label="Pokaż ulubionych">⭐ <span class="fav-n" id="favCnt">0</span></button>
    <button class="btn primary" id="addBtn" aria-label="Dodaj gracza do śledzenia">+ Śledź</button>
  </div>
</div>

<div class="toolbar">
  <span class="tlbl">Serwer</span>
  <div class="srv-wrap" id="srvWrap">
    <button class="srv-btn" id="srvBtn" type="button" aria-label="Wybierz serwer" aria-haspopup="listbox">
      <span id="srvBtnFlag"></span>
      <span id="srvBtnCode"></span>
      <span id="srvBtnName">Ładowanie...</span>
      <span class="srv-arrow">▾</span>
    </button>
    <div class="srv-drop h" id="srvDrop" role="listbox">
      <div class="srv-search-wrap">
        <input type="text" id="srvSearch" placeholder="Szukaj serwera..." autocomplete="off" aria-label="Szukaj serwera">
      </div>
      <div class="srv-list" id="srvList"></div>
    </div>
  </div>
  <span class="tlbl">Ranking</span>
  <select id="eventSelect" style="min-width:190px" aria-label="Wybierz typ rankingu"><option>Ładowanie...</option></select>
  <div class="seg" id="typeSeg" role="tablist">
    <button class="seg-b on" data-v="player" role="tab" aria-selected="true">👤 Gracze</button>
    <button class="seg-b" data-v="alliance" role="tab" aria-selected="false">🛡 Sojusze</button>
  </div>
  <div class="sw"><input type="text" id="searchInput" placeholder="Rank lub nick... (/)" aria-label="Wyszukaj rank lub nick"></div>
  <button class="btn" id="goSearch" title="Szukaj (Enter)" aria-label="Szukaj">↵</button>
  <button class="btn" id="refreshBtn" title="Odśwież (R)" aria-label="Odśwież">↺</button>
  <button class="btn" id="filterBtn" title="Filtry (F)" aria-label="Pokaż filtry" aria-expanded="false">⚙ Filtry</button>
  <div class="dwrap">
    <button class="btn" id="exportBtn" title="Eksport (E)" aria-label="Eksportuj" aria-haspopup="menu">⬇ Eksport</button>
    <div class="mini-drop h" id="expDrop" role="menu">
      <button class="mini-opt" data-fmt="csv">📄 CSV (.csv)</button>
      <button class="mini-opt" data-fmt="json">{} JSON (.json)</button>
      <button class="mini-opt" data-fmt="link">🔗 Kopiuj link</button>
    </div>
  </div>
  <div class="dwrap">
    <button class="btn" id="autoRefBtn" title="Auto-odświeżanie" aria-label="Auto-odświeżanie" aria-haspopup="menu">⏱ Auto</button>
    <div class="mini-drop h" id="autoRefDrop" role="menu">
      <button class="mini-opt" data-v="0">⏹ Wyłącz</button>
      <button class="mini-opt" data-v="30">30 sekund</button>
      <button class="mini-opt" data-v="60">1 minuta</button>
      <button class="mini-opt" data-v="300">5 minut</button>
      <button class="mini-opt" data-v="600">10 minut</button>
    </div>
  </div>
</div>

<div class="fbar h" id="fBar">
  <span class="tlbl">Sojusz:</span>
  <div class="seg" id="fAlSeg">
    <button class="seg-b on" data-f="all">Wszyscy</button>
    <button class="seg-b" data-f="with">Z sojuszem</button>
    <button class="seg-b" data-f="without">Bez sojuszu</button>
  </div>
  <span class="tlbl">Nazwa sojuszu:</span>
  <div class="sw"><input type="text" id="fAlName" placeholder="Filtruj po sojuszu..." aria-label="Filtruj po nazwie sojuszu"></div>
  <span class="tlbl">Min. wynik:</span>
  <input type="number" id="fMinScore" placeholder="0" min="0" style="width:110px" aria-label="Minimalny wynik">
  <button class="btn" id="fClear" aria-label="Wyczyść filtry">× Wyczyść</button>
</div>

<div class="cats" id="catBar" style="display:none"></div>

<div class="sbar spin" id="sBar">
  <div class="dot"></div>
  <span id="sMsg">Ładowanie...</span>
  <div class="r">
    <span>Razem: <b id="sTotal">—</b></span>
    <span>Strona: <b id="sPage">—</b></span>
    <span id="sAutoR" style="display:none">⏱ <b id="sAutoRT">—</b></span>
  </div>
</div>

<div id="mainView"></div>
<div class="pg" id="pgBar" style="display:none"></div>

<div id="favView" style="display:none" class="fp">
  <div class="fph">
    <div class="fpt">⭐ Obserwowani gracze</div>
    <button class="btn" id="clearFavBtn">🗑 Wyczyść</button>
  </div>
  <div class="fg" id="favGrid"></div>
</div>

<div class="cbar h" id="cBar" role="region" aria-label="Pasek porównania">
  <span class="ctitle">📊 Porównaj <span class="ccnt" id="cCount">0</span> / 4</span>
  <div class="cChips" id="cChips"></div>
  <button class="btn primary" id="cOpenBtn">Porównaj →</button>
  <button class="btn" id="cClearBtn">Wyczyść</button>
</div>

<div class="mb h" id="mBackdrop" role="dialog" aria-label="Dodaj gracza" aria-modal="true">
  <div class="mo">
    <h3>⭐ Śledź gracza</h3>
    <label for="mName">Nick gracza</label><input type="text" id="mName" placeholder="Wpisz nick...">
    <label>Serwer</label>
    <div class="srv-wrap" id="mSrvWrap">
      <button class="srv-btn" id="mSrvBtn" type="button" aria-haspopup="listbox">
        <span id="mSrvBtnFlag"></span>
        <span id="mSrvBtnCode"></span>
        <span id="mSrvBtnName">Wybierz serwer</span>
        <span class="srv-arrow">▾</span>
      </button>
      <div class="srv-drop h" id="mSrvDrop" role="listbox">
        <div class="srv-search-wrap">
          <input type="text" id="mSrvSearch" placeholder="Szukaj serwera..." autocomplete="off">
        </div>
        <div class="srv-list" id="mSrvList"></div>
      </div>
    </div>
    <div class="me" id="mErr"></div>
    <div class="ma">
      <button class="btn" id="mCancel">Anuluj</button>
      <button class="btn primary" id="mOk">⭐ Śledź</button>
    </div>
  </div>
</div>

<div class="mb h" id="cmpBackdrop" role="dialog" aria-label="Porównanie" aria-modal="true">
  <div class="mo cmt">
    <div class="cmt-head">
      <h3>📊 Porównanie</h3>
      <button class="btn icon-btn" id="cmpClose" aria-label="Zamknij">×</button>
    </div>
    <div id="cmpBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
