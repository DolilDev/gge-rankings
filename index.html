<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GGE Rankings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<div class="header">
  <a class="logo" href="/" style="text-decoration:none;color:inherit">🏰 GGE Rankings</a>
  <nav class="nav">
    <button class="nav-btn on" data-p="ranking">⚔️ Ranking</button>
    <button class="nav-btn" data-p="favorites">⭐ Ulubieni</button>
  </nav>
  <div class="header-right">
    <button class="btn" id="favBtn">⭐ <span class="fav-n" id="favCnt">0</span></button>
    <button class="btn primary" id="addBtn">+ Śledź</button>
  </div>
</div>

<div class="toolbar">
  <span class="tlbl">Serwer</span>
  <div class="srv-wrap" id="srvWrap">
    <button class="srv-btn" id="srvBtn" type="button">
      <span id="srvBtnFlag"></span>
      <span id="srvBtnCode"></span>
      <span id="srvBtnName">Ładowanie...</span>
      <span class="srv-arrow">▾</span>
    </button>
    <div class="srv-drop h" id="srvDrop">
      <div class="srv-search-wrap">
        <input type="text" id="srvSearch" placeholder="Szukaj serwera..." autocomplete="off">
      </div>
      <div class="srv-list" id="srvList"></div>
    </div>
  </div>
  <span class="tlbl">Ranking</span>
  <select id="eventSelect" style="min-width:190px"><option>Ładowanie...</option></select>
  <div class="seg" id="typeSeg">
    <button class="seg-b on" data-v="player">👤 Gracze</button>
    <button class="seg-b" data-v="alliance">🛡 Sojusze</button>
  </div>
  <div class="sw"><input type="text" id="searchInput" placeholder="Rank lub nick..."></div>
  <button class="btn" id="goSearch">↵</button>
  <button class="btn" id="refreshBtn">↺</button>
</div>

<div class="cats" id="catBar" style="display:none"></div>

<div class="sbar spin" id="sBar">
  <div class="dot"></div>
  <span id="sMsg">Ładowanie...</span>
  <div class="r">
    <span>Razem: <b id="sTotal">—</b></span>
    <span>Strona: <b id="sPage">—</b></span>
  </div>
</div>

<div id="mainView"></div>
<div class="pg" id="pgBar" style="display:none"></div>

<div id="favView" style="display:none" class="fp">
  <div class="fph">
    <div class="fpt">⭐ Obserwowani gracze</div>
    <button class="btn" id="clearFavBtn">🗑 Wyczyść</button>
  </div>
  <div class="fg" id="favGrid"></div>
</div>

<div class="mb h" id="mBackdrop">
  <div class="mo">
    <h3>⭐ Śledź gracza</h3>
    <label>Nick gracza</label><input type="text" id="mName" placeholder="Wpisz nick...">
    <label>Serwer</label>
    <div class="srv-wrap" id="mSrvWrap">
      <button class="srv-btn" id="mSrvBtn" type="button">
        <span id="mSrvBtnFlag"></span>
        <span id="mSrvBtnCode"></span>
        <span id="mSrvBtnName">Wybierz serwer</span>
        <span class="srv-arrow">▾</span>
      </button>
      <div class="srv-drop h" id="mSrvDrop">
        <div class="srv-search-wrap">
          <input type="text" id="mSrvSearch" placeholder="Szukaj serwera..." autocomplete="off">
        </div>
        <div class="srv-list" id="mSrvList"></div>
      </div>
    </div>
    <div class="me" id="mErr"></div>
    <div class="ma">
      <button class="btn" id="mCancel">Anuluj</button>
      <button class="btn primary" id="mOk">⭐ Śledź</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
